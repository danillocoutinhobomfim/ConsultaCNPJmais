<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="ConsultaCNPJ+ — consulta de CNPJ com dados públicos da Receita Federal via publica.cnpj.ws"
    />
    <link rel="icon" type="image/png" href="/logo.png" />
    <title>ConsultaCNPJ+ · Receita Federal</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div
        style="
          font-family: system-ui, Arial, sans-serif;
          padding: 40px;
          text-align: center;
          color: #0f172a;
          background: #f1f5f9;
          min-height: 100vh;
        "
      >
        <h1>ConsultaCNPJ+</h1>
        <p>
          O JavaScript está desativado neste navegador. Ative-o para usar o
          sistema.
        </p>
      </div>
    </noscript>
    <script>
      // Rede de segurança: se qualquer erro de JS ocorrer antes do React
      // montar, mostra a mensagem em vez de deixar a página em branco.
      window.addEventListener("error", function (e) {
        var root = document.getElementById("root");
        if (root && root.childElementCount === 0 && e && e.message) {
          root.innerHTML =
            '<div style="font-family:system-ui,Arial,sans-serif;max-width:560px;margin:60px auto;padding:24px;border:1px solid #e2e8f0;border-radius:16px;background:#fff;color:#0f172a">' +
            '<h2 style="margin:0 0 8px;font-size:18px">⚠️ ConsultaCNPJ+ · Erro ao carregar</h2>' +
            '<p style="font-size:14px;color:#475569;margin:0 0 8px">Detalhes técnicos:</p>' +
            '<pre style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:12px;font-size:12px;color:#b91c1c;white-space:pre-wrap;word-break:break-word">' +
            String(e.message).replace(/[<>]/g, "") +
            "</pre></div>";
        }
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
